name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Build on the oldest supported runner so the binary runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfontconfig1

      - name: Build
        run: ./build.sh

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built="$(./dist/lazyautoclicker --version | awk '{print $NF}')"
          [[ "v$built" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME != app $built"; exit 1; }

      - name: Package
        id: pkg
        run: |
          ver="$(./dist/lazyautoclicker --version | awk '{print $NF}')"
          name="lazyautoclicker-$ver-linux-x86_64"
          mkdir -p "$name/assets" "$name/packaging"
          cp dist/lazyautoclicker install.sh uninstall.sh README.md LICENSE "$name/"
          cp assets/lazyautoclicker.svg "$name/assets/"
          cp packaging/* "$name/packaging/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}.tar.gz*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
          generate_release_notes: true
